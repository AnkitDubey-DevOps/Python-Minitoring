
# Build Python app, push Docker image, and create a temporary URL

name: Python Monitoring

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # Get code from GitHub
      - uses: actions/checkout@v4

      # Install Python
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Install project dependencies
      - name: Install Dependencies
        run: |
          pip install -r Python-Monitoring-Project-main/src/requirements.txt
          pip install pytest

      # Run project tests
      - name: Run Tests
        run: |
          PYTHONPATH=Python-Monitoring-Project-main/src pytest Python-Monitoring-Project-main/src

      # Login to Docker Hub
      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build and push Docker image
      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: ./Python-Monitoring-Project-main/src
          file: ./Python-Monitoring-Project-main/src/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/python-monitoring:latest

      # Start the Python application
      - name: Start App
        run: |
          cd Python-Monitoring-Project-main/src
          nohup python run.py > app.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://localhost:5000/ > /dev/null; then
              echo "Python app is running"
              exit 0
            fi
            sleep 2
          done
          cat app.log
          exit 1

      # Install Cloudflare Tunnel
      - uses: AnimMouse/setup-cloudflared@v2

      # Create temporary public URL
      - name: Start Tunnel
        uses: AnimMouse/setup-cloudflared/tunnel@v2
        with:
          url: http://localhost:5000

      # Keep app running temporarily
      - name: Keep App Running
        run: sleep 1500
